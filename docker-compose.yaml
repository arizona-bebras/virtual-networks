services:
  db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    ports:
      - "5435:5432"
    environment:
      POSTGRES_PASSWORD: example
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "50051:50051"
    environment:
      PORT: 3000
      TRUSTED_ORIGINS: http://localhost:5173,http://192.168.1.136
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-supersecretkey}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: postgres
      ROUTER_ADDRESS: ${ROUTER_ADDRESS:-localhost}

  router:
    build:
      context: .
      dockerfile: router/Dockerfile
    restart: always
    depends_on:
      backend:
        condition: service_started
    ports:
      - "51820:51820/udp"
      - "9090:9090"
    environment:
      ROUTER_CONTROL_PLANE_ADDR: backend:50051
      ROUTER_ID: ${ROUTER_ID:-local-router}
      ROUTER_VERSION: ${ROUTER_VERSION:-compose}
      ROUTER_PROMETHEUS_ADDR: :9090

volumes:
  postgres:
