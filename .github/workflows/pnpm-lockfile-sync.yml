name: Sync pnpm Lockfile

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pnpm-lockfile-sync-main
  cancel-in-progress: false

jobs:
  sync-lockfile:
    name: Merge branch lockfiles into main
    if: "${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'chore(lockfile): merge pnpm branch lockfiles') }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Merge pnpm branch lockfiles
        run: pnpm install --ignore-scripts --merge-git-branch-lockfiles

      - name: Commit merged lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml ':(glob)pnpm-lock.*.yaml'; then
            echo "No lockfile changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pnpm-lock.yaml
          git add -u ':(glob)pnpm-lock.*.yaml'
          git commit -m "chore(lockfile): merge pnpm branch lockfiles"
          git push origin HEAD:main
