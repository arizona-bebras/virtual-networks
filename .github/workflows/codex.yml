name: Codex Code Review

# Determine when the review action should be run:
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: codex-structured-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-structured-review:
    name: Run Codex structured review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-5.3-codex' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PREVIOUS_HEAD_SHA: ${{ github.event.before || '' }}
      PR_ACTION: ${{ github.event.action }}
      REPOSITORY: ${{ github.repository }}
    outputs:
      codex-output: ${{ steps.run-codex.outputs.final-message }}
    steps:
      - name: Checkout pull request head commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base and head refs
        run: |
          set -euxo pipefail
          git fetch --no-tags origin \
            "${{ github.event.pull_request.base.ref }}" \
            +refs/pull/${{ github.event.pull_request.number }}/head

          if [ -n "${PREVIOUS_HEAD_SHA}" ]; then
            git fetch --no-tags --depth=1 origin "${PREVIOUS_HEAD_SHA}" || true
          fi
        shell: bash

      # The structured output schema ensures that codex produces comments
      # with filepaths, line numbers, title, body, etc.
      - name: Generate structured output schema
        run: |
          set -euo pipefail
          cat <<'JSON' > codex-output-schema.json
          {
              "type": "object",
              "properties": {
                "findings": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "title": {
                        "type": "string",
                        "maxLength": 80
                      },
                      "body": {
                        "type": "string",
                        "minLength": 1
                      },
                      "confidence_score": {
                        "type": "number",
                        "minimum": 0,
                        "maximum": 1
                      },
                      "priority": {
                        "type": "integer",
                        "minimum": 0,
                        "maximum": 3
                      },
                      "code_location": {
                        "type": "object",
                        "properties": {
                          "absolute_file_path": {
                            "type": "string",
                            "minLength": 1
                          },
                          "line_range": {
                            "type": "object",
                            "properties": {
                              "start": {
                                "type": "integer",
                                "minimum": 1
                              },
                              "end": {
                                "type": "integer",
                                "minimum": 1
                              }
                            },
                            "required": [
                              "start",
                              "end"
                            ],
                            "additionalProperties": false
                          }
                        },
                        "required": [
                          "absolute_file_path",
                          "line_range"
                        ],
                        "additionalProperties": false
                      }
                    },
                    "required": [
                      "title",
                      "body",
                      "confidence_score",
                      "priority",
                      "code_location"
                    ],
                    "additionalProperties": false
                  }
                },
                "overall_correctness": {
                  "type": "string",
                  "enum": [
                    "patch is correct",
                    "patch is incorrect"
                  ]
                },
                "overall_explanation": {
                  "type": "string",
                  "minLength": 1
                },
                "overall_confidence_score": {
                  "type": "number",
                  "minimum": 0,
                  "maximum": 1
                }
              },
              "required": [
                "findings",
                "overall_correctness",
                "overall_explanation",
                "overall_confidence_score"
              ],
              "additionalProperties": false
            }
          JSON
        shell: bash

      # This section generates our prompt:
      - name: Build Codex review prompt
        env:
          REVIEW_PROMPT_PATH: ${{ vars.CODEX_PROMPT_PATH || 'review_prompt.md' }}
        run: |
          set -euo pipefail
          PROMPT_PATH="codex-prompt.md"
          TEMPLATE_PATH="${REVIEW_PROMPT_PATH}"

          if [ -n "$TEMPLATE_PATH" ] && [ -f "$TEMPLATE_PATH" ]; then
            cat "$TEMPLATE_PATH" > "$PROMPT_PATH"
          else
            {
              printf '%s\n' "You are acting as a reviewer for a proposed code change made by another engineer."
              printf '%s\n' "Focus on issues that impact correctness, performance, security, maintainability, or developer experience."
              printf '%s\n' "Flag only actionable issues introduced by the pull request."
              printf '%s\n' "When you flag an issue, provide a short, direct explanation and cite the affected file and line range."
              printf '%s\n' "Prioritize severe issues and avoid nit-level comments unless they block understanding of the diff."
              printf '%s\n' "After listing findings, produce an overall correctness verdict (\"patch is correct\" or \"patch is incorrect\") with a concise justification and a confidence score between 0 and 1."
              printf '%s\n' "Ensure that file citations and line numbers are exactly correct using the tools available; if they are incorrect your comments will be rejected."
            } > "$PROMPT_PATH"
          fi

          {
            REVIEW_BASE_SHA="${BASE_SHA}"
            REVIEW_SCOPE="full pull request diff"

            if [ "${PR_ACTION}" = "synchronize" ] && [ -n "${PREVIOUS_HEAD_SHA}" ]; then
              if git cat-file -e "${PREVIOUS_HEAD_SHA}^{commit}" 2>/dev/null; then
                REVIEW_BASE_SHA="${PREVIOUS_HEAD_SHA}"
                REVIEW_SCOPE="newly pushed commits only"
              else
                echo "Previous head SHA ${PREVIOUS_HEAD_SHA} is unavailable locally; falling back to full PR diff."
              fi
            fi

            echo ""
            echo "Repository: ${REPOSITORY}"
            echo "Pull Request #: ${PR_NUMBER}"
            echo "Pull request action: ${PR_ACTION}"
            echo "Review scope: ${REVIEW_SCOPE}"
            echo "Base ref: ${{ github.event.pull_request.base.ref }}"
            echo "Head ref: ${{ github.event.pull_request.head.ref }}"
            echo "PR Base SHA: ${BASE_SHA}"
            echo "Review Base SHA: ${REVIEW_BASE_SHA}"
            echo "Head SHA: ${HEAD_SHA}"
            echo "Changed files:"
            git --no-pager diff --name-status "${REVIEW_BASE_SHA}" "${HEAD_SHA}" -- . ':(exclude)pnpm-lock*.yaml' ':(exclude)**/pnpm-lock*.yaml'
            echo ""
            echo "Unified diff (context=5):"
            git --no-pager diff --unified=5 --stat=200 "${REVIEW_BASE_SHA}" "${HEAD_SHA}" -- . ':(exclude)pnpm-lock*.yaml' ':(exclude)**/pnpm-lock*.yaml' > /tmp/diffstat.txt
            git --no-pager diff --unified=5 "${REVIEW_BASE_SHA}" "${HEAD_SHA}" -- . ':(exclude)pnpm-lock*.yaml' ':(exclude)**/pnpm-lock*.yaml' > /tmp/full.diff
            cat /tmp/diffstat.txt
            echo ""
            cat /tmp/full.diff
          } >> "$PROMPT_PATH"
        shell: bash

      # Putting it all together: we run the codex action with our code review prompt,
      # structured output, and output file:
      - name: Run Codex structured review
        id: run-codex
        uses: activadee/codex-action@ca5a8acaf860ba6525582249dc3b504f70af7b9f
        with:
          codex-auth-json-b64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
          prompt-file: codex-prompt.md
          output-schema-file: codex-output-schema.json
          output-file: codex-output.json
          sandbox: read-only
          model: ${{ env.CODEX_MODEL }}

      - name: Inspect structured Codex output
        if: ${{ always() }}
        run: |
          if [ -s codex-output.json ]; then
            jq '.' codex-output.json || true
          else
            echo "Codex output file missing"
          fi
        shell: bash

      # This step produces in-line code review comments on specific line
      # ranges of code.
      - name: Publish inline review comments
        if: ${{ always() }}
        env:
          REVIEW_JSON: codex-output.json
        run: |
          set -euo pipefail
          if [ ! -s "$REVIEW_JSON" ]; then
            echo "No Codex output file present; skipping comment publishing."
            exit 0
          fi
          findings_count=$(jq '.findings | length' "$REVIEW_JSON")
          if [ "$findings_count" -eq 0 ]; then
            echo "Codex returned no findings; skipping inline comments."
            exit 0
          fi
          repo_root="$(git rev-parse --show-toplevel)"
          jq -c --arg commit "$HEAD_SHA" --arg repo_root "$repo_root" '.findings[] | {
              body: ([.title, .body, ("Confidence: " + (.confidence_score | tostring))] + (if has("priority") then [("Priority: P" + (.priority | tostring))] else [] end) | join("\n\n")),
              commit_id: $commit,
              path: (
                .code_location.absolute_file_path as $file_path
                | if ($file_path | startswith($repo_root + "/")) then
                    $file_path | ltrimstr($repo_root + "/")
                  elif ($file_path | startswith($repo_root + "\\")) then
                    $file_path | ltrimstr($repo_root + "\\")
                  else
                    $file_path
                  end
                | gsub("\\\\"; "/")
              ),
              line: .code_location.line_range.end,
              side: "RIGHT",
              start_line: (if .code_location.line_range.start != .code_location.line_range.end then .code_location.line_range.start else null end),
              start_side: (if .code_location.line_range.start != .code_location.line_range.end then "RIGHT" else null end)
            } | with_entries(select(.value != null))' "$REVIEW_JSON" > findings.jsonl
          published_count=0
          fallback_count=0
          skipped_count=0
          while IFS= read -r payload; do
            echo "Posting review comment payload:" && echo "$payload" | jq '.'
            response_file="$(mktemp)"
            http_status="$(curl -sS \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}/comments" \
              -d "$payload" \
              -o "$response_file" \
              -w "%{http_code}")"

            if [ "$http_status" = "201" ]; then
              jq '.' "$response_file"
              published_count=$((published_count + 1))
              rm -f "$response_file"
              continue
            fi

            echo "Inline comment publish returned HTTP ${http_status}"
            jq '.' "$response_file" || true

            if [ "$http_status" = "422" ]; then
              fallback_payload="$(echo "$payload" | jq '{body, commit_id, path, subject_type: "file"}')"
              fallback_response_file="$(mktemp)"
              fallback_status="$(curl -sS \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}/comments" \
                -d "$fallback_payload" \
                -o "$fallback_response_file" \
                -w "%{http_code}")"

              echo "Retrying as file-level review comment returned HTTP ${fallback_status}"
              jq '.' "$fallback_response_file" || true

              if [ "$fallback_status" = "201" ]; then
                fallback_count=$((fallback_count + 1))
              else
                skipped_count=$((skipped_count + 1))
              fi

              rm -f "$fallback_response_file"
              rm -f "$response_file"
              continue
            fi

            rm -f "$response_file"
            exit 1
          done < findings.jsonl
          echo "Published inline comments: ${published_count}"
          echo "Published file-level fallback comments: ${fallback_count}"
          echo "Skipped invalid comments after fallback: ${skipped_count}"
        shell: bash

      # This section creates a single comment summarizing the review.
      - name: Publish overall summary comment
        if: ${{ always() }}
        env:
          REVIEW_JSON: codex-output.json
        run: |
          set -euo pipefail
          if [ ! -s "$REVIEW_JSON" ]; then
            echo "Codex output missing; skipping summary."
            exit 0
          fi
          overall_state=$(jq -r '.overall_correctness' "$REVIEW_JSON")
          overall_body=$(jq -r '.overall_explanation' "$REVIEW_JSON")
          confidence=$(jq -r '.overall_confidence_score' "$REVIEW_JSON")
          payload="$(jq -n \
            --arg overall_state "$overall_state" \
            --arg confidence "$confidence" \
            --arg overall_body "$overall_body" \
            '{body: ("**Codex automated review**\n\nVerdict: " + $overall_state + "\nConfidence: " + $confidence + "\n\n" + $overall_body)}'
          )"
          response_file="$(mktemp)"
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -d "$payload" \
            -o "$response_file"
          jq '.' "$response_file"
          rm -f "$response_file"
        shell: bash
