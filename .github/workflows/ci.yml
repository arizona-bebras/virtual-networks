name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.filter.outputs.node }}
      backend: ${{ steps.filter.outputs.backend }}
      common: ${{ steps.filter.outputs.common }}
      frontend: ${{ steps.filter.outputs.frontend }}
      proto: ${{ steps.filter.outputs.proto }}
      router: ${{ steps.filter.outputs.router }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed packages
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            node:
              - 'backend/**'
              - 'common/**'
              - 'frontend/**'
              - 'proto/**'
              - 'biome.json'
              - 'package.json'
              - 'pnpm-lock*.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'proto/**'
              - 'common/**'
              - 'biome.json'
              - 'package.json'
              - 'pnpm-lock*.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            common:
              - 'common/**'
              - 'biome.json'
              - 'package.json'
              - 'pnpm-lock*.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'proto/**'
              - 'common/**'
              - 'biome.json'
              - 'package.json'
              - 'pnpm-lock*.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - 'package.json'
              - 'pnpm-lock*.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            router:
              - 'router/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'

  node-workspaces:
    name: Node Workspaces
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.node == 'true'
    outputs:
      common_lint: ${{ steps.common_lint.outcome }}
      backend_lint: ${{ steps.backend_lint.outcome }}
      frontend_lint: ${{ steps.frontend_lint.outcome }}
      frontend_dependencies: ${{ steps.frontend_dependencies.outcome }}
      frontend_check: ${{ steps.frontend_check.outcome }}
      common_build: ${{ steps.common_build.outcome }}
      backend_build: ${{ steps.backend_build.outcome }}
      frontend_build: ${{ steps.frontend_build.outcome }}
      proto_ts_build: ${{ steps.proto_ts_build.outcome }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare pnpm lockfile for pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          branch_lockfile="pnpm-lock.${GITHUB_HEAD_REF//\//!}.yaml"

          if [ ! -f "$branch_lockfile" ]; then
            echo "Expected branch lockfile '$branch_lockfile' was not found."
            exit 0
          fi

          cp "$branch_lockfile" pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Prepare frontend environment
        if: needs.changes.outputs.frontend == 'true'
        run: cp frontend/.env.example frontend/.env

      - name: Setup reviewdog
        if: needs.changes.outputs.common == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
        uses: reviewdog/action-setup@v1

      - name: Comment common Biome issues
        id: common_lint
        if: needs.changes.outputs.common == 'true'
        continue-on-error: true
        shell: bash
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reporter="github-check"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            reporter="github-pr-review"
          fi

          output_file="$(mktemp)"
          biome_status=0

          ./common/node_modules/.bin/biome check --reporter=checkstyle common >"$output_file" || biome_status=$?

          reviewdog -f=checkstyle -name="biome-common" -reporter="$reporter" -filter-mode=file -fail-level=any <"$output_file"
          reviewdog_status=$?

          if [ "$biome_status" -gt 1 ]; then
            cat "$output_file"
            exit "$biome_status"
          fi

          exit "$reviewdog_status"

      - name: Comment backend Biome issues
        id: backend_lint
        if: needs.changes.outputs.backend == 'true'
        continue-on-error: true
        shell: bash
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reporter="github-check"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            reporter="github-pr-review"
          fi

          output_file="$(mktemp)"
          biome_status=0

          ./backend/node_modules/.bin/biome check --reporter=checkstyle backend >"$output_file" || biome_status=$?

          reviewdog -f=checkstyle -name="biome-backend" -reporter="$reporter" -filter-mode=file -fail-level=any <"$output_file"
          reviewdog_status=$?

          if [ "$biome_status" -gt 1 ]; then
            cat "$output_file"
            exit "$biome_status"
          fi

          exit "$reviewdog_status"

      - name: Comment frontend Biome issues
        id: frontend_lint
        if: needs.changes.outputs.frontend == 'true'
        continue-on-error: true
        shell: bash
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reporter="github-check"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            reporter="github-pr-review"
          fi

          output_file="$(mktemp)"
          biome_status=0

          ./frontend/node_modules/.bin/biome check --reporter=checkstyle frontend >"$output_file" || biome_status=$?

          reviewdog -f=checkstyle -name="biome-frontend" -reporter="$reporter" -filter-mode=file -fail-level=any <"$output_file"
          reviewdog_status=$?

          if [ "$biome_status" -gt 1 ]; then
            cat "$output_file"
            exit "$biome_status"
          fi

          exit "$reviewdog_status"

      - name: Build frontend type-check dependencies
        id: frontend_dependencies
        if: needs.changes.outputs.frontend == 'true'
        continue-on-error: true
        run: pnpm exec turbo run common#build

      - name: Type-check frontend
        id: frontend_check
        if: needs.changes.outputs.frontend == 'true'
        continue-on-error: true
        shell: bash
        run: |
          output_file="$RUNNER_TEMP/svelte-check.txt"
          status=0

          (
            cd frontend
            pnpm type-check --output machine
          ) >"$output_file" 2>&1 || status=$?

          while IFS= read -r line; do
            if [[ "$line" =~ ^[0-9]+\ (ERROR|WARNING)\ \"([^\"]+)\"\ ([0-9]+):([0-9]+)\ \"(.*)\"$ ]]; then
              severity=$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')
              file="${BASH_REMATCH[2]}"
              line_no="${BASH_REMATCH[3]}"
              col_no="${BASH_REMATCH[4]}"
              message="${BASH_REMATCH[5]}"

              if [ "$line_no" -le 0 ]; then
                line_no=1
              fi

              if [ "$col_no" -le 0 ]; then
                col_no=1
              fi

              echo "::$severity file=frontend/$file,line=$line_no,col=$col_no::$message"
            fi
          done <"$output_file"

          cat "$output_file"
          exit "$status"

      - name: Build common
        id: common_build
        if: needs.changes.outputs.common == 'true'
        continue-on-error: true
        run: pnpm exec turbo run common#build

      - name: Build backend
        id: backend_build
        if: needs.changes.outputs.backend == 'true'
        continue-on-error: true
        run: pnpm exec turbo run backend#build

      - name: Build frontend
        id: frontend_build
        if: needs.changes.outputs.frontend == 'true'
        continue-on-error: true
        run: pnpm exec turbo run frontend#build

      - name: Build proto TypeScript artifacts
        id: proto_ts_build
        if: needs.changes.outputs.proto == 'true'
        continue-on-error: true
        run: pnpm exec turbo run proto#build

      - name: Fail if Node workspace checks failed
        if: always()
        env:
          COMMON_CHANGED: ${{ needs.changes.outputs.common }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          PROTO_CHANGED: ${{ needs.changes.outputs.proto }}
          COMMON_LINT_OUTCOME: ${{ steps.common_lint.outcome }}
          BACKEND_LINT_OUTCOME: ${{ steps.backend_lint.outcome }}
          FRONTEND_LINT_OUTCOME: ${{ steps.frontend_lint.outcome }}
          FRONTEND_DEPENDENCIES_OUTCOME: ${{ steps.frontend_dependencies.outcome }}
          FRONTEND_CHECK_OUTCOME: ${{ steps.frontend_check.outcome }}
          COMMON_BUILD_OUTCOME: ${{ steps.common_build.outcome }}
          BACKEND_BUILD_OUTCOME: ${{ steps.backend_build.outcome }}
          FRONTEND_BUILD_OUTCOME: ${{ steps.frontend_build.outcome }}
          PROTO_TS_BUILD_OUTCOME: ${{ steps.proto_ts_build.outcome }}
        run: |
          failed=0

          if [ "$COMMON_CHANGED" = "true" ] && [ "$COMMON_LINT_OUTCOME" != "success" ]; then
            echo "Common Biome check failed."
            failed=1
          fi

          if [ "$BACKEND_CHANGED" = "true" ] && [ "$BACKEND_LINT_OUTCOME" != "success" ]; then
            echo "Backend Biome check failed."
            failed=1
          fi

          if [ "$FRONTEND_CHANGED" = "true" ] && [ "$FRONTEND_LINT_OUTCOME" != "success" ]; then
            echo "Frontend Biome check failed."
            failed=1
          fi

          if [ "$FRONTEND_CHANGED" = "true" ] && [ "$FRONTEND_DEPENDENCIES_OUTCOME" != "success" ]; then
            echo "Frontend type-check dependency build failed."
            failed=1
          fi

          if [ "$FRONTEND_CHANGED" = "true" ] && [ "$FRONTEND_CHECK_OUTCOME" != "success" ]; then
            echo "Frontend type-check failed."
            failed=1
          fi

          if [ "$COMMON_CHANGED" = "true" ] && [ "$COMMON_BUILD_OUTCOME" != "success" ]; then
            echo "Common build failed."
            failed=1
          fi

          if [ "$BACKEND_CHANGED" = "true" ] && [ "$BACKEND_BUILD_OUTCOME" != "success" ]; then
            echo "Backend build failed."
            failed=1
          fi

          if [ "$FRONTEND_CHANGED" = "true" ] && [ "$FRONTEND_BUILD_OUTCOME" != "success" ]; then
            echo "Frontend build failed."
            failed=1
          fi

          if [ "$PROTO_CHANGED" = "true" ] && [ "$PROTO_TS_BUILD_OUTCOME" != "success" ]; then
            echo "Proto TypeScript build failed."
            failed=1
          fi

          exit "$failed"

  proto:
    name: Proto Validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    outputs:
      generate: ${{ steps.proto_generate.outcome }}
      go_vet: ${{ steps.proto_go_vet.outcome }}
      go_build: ${{ steps.proto_go_build.outcome }}
    env:
      PROTOC_VERSION: "25.2"
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: proto/go.mod
          cache-dependency-path: |
            proto/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare pnpm lockfile for pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          branch_lockfile="pnpm-lock.${GITHUB_HEAD_REF//\//!}.yaml"

          if [ ! -f "$branch_lockfile" ]; then
            echo "Expected branch lockfile '$branch_lockfile' was not found."
            exit 0
          fi

          cp "$branch_lockfile" pnpm-lock.yaml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}

      - name: Verify generated protobuf artifacts
        id: proto_generate
        run: pnpm exec turbo run proto#generate --force

      - name: Lint generated Go proto module
        id: proto_go_vet
        working-directory: proto
        run: go vet ./...

      - name: Build generated Go proto module
        id: proto_go_build
        working-directory: proto
        run: go build ./...

  go-router:
    name: Go Router
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.router == 'true'
    outputs:
      go_vet: ${{ steps.router_go_vet.outcome }}
      go_build: ${{ steps.router_go_build.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: router/go.mod
          cache-dependency-path: |
            router/go.sum

      - name: Lint router Go module
        id: router_go_vet
        working-directory: router
        shell: bash
        run: go vet ./...

      - name: Build router Go module
        id: router_go_build
        working-directory: router
        shell: bash
        run: go build ./...
