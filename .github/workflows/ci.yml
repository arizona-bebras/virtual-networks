name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      proto: ${{ steps.filter.outputs.proto }}
      router: ${{ steps.filter.outputs.router }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed packages
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'proto/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'proto/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            router:
              - 'router/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint backend
        run: pnpm --filter backend exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build backend
        run: pnpm --filter backend build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint frontend
        run: pnpm --filter frontend lint

      - name: Type-check frontend
        run: pnpm --filter frontend check

      - name: Build frontend
        run: pnpm --filter frontend build

  proto:
    name: Proto Validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proto == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: proto/go.mod
          cache-dependency-path: |
            proto/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Verify generated protobuf artifacts
        run: pnpm --filter proto generate

      - name: Check for uncommitted generated changes
        run: git diff --exit-code -- proto/gen

  go-proto:
    name: Go Proto
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proto == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: proto/go.mod
          cache-dependency-path: |
            proto/go.sum

      - name: Lint proto Go module
        working-directory: proto
        run: go vet ./...

      - name: Build proto Go module
        working-directory: proto
        run: go build ./...

  go-router:
    name: Go Router
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.router == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: router/go.mod
          cache-dependency-path: |
            proto/go.sum

      - name: Lint router Go module
        working-directory: router
        shell: bash
        run: |
          packages="$(go list ./... 2>/dev/null || true)"

          if [ -z "$packages" ]; then
            echo "No Go packages found in router; skipping go vet."
            exit 0
          fi

          go vet ./...

      - name: Build router Go module
        working-directory: router
        shell: bash
        run: |
          packages="$(go list ./... 2>/dev/null || true)"

          if [ -z "$packages" ]; then
            echo "No Go packages found in router; skipping go build."
            exit 0
          fi

          go build ./...
