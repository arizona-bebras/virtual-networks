name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      proto: ${{ steps.filter.outputs.proto }}
      router: ${{ steps.filter.outputs.router }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed packages
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'proto/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'proto/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            router:
              - 'router/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint backend
        id: backend_lint
        continue-on-error: true
        run: pnpm --filter backend exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build backend
        id: backend_build
        continue-on-error: true
        run: pnpm --filter backend build

      - name: Fail if backend checks failed
        if: always()
        env:
          BACKEND_LINT_OUTCOME: ${{ steps.backend_lint.outcome }}
          BACKEND_BUILD_OUTCOME: ${{ steps.backend_build.outcome }}
        run: |
          failed=0

          if [ "$BACKEND_LINT_OUTCOME" != "success" ]; then
            echo "Backend lint failed."
            failed=1
          fi

          if [ "$BACKEND_BUILD_OUTCOME" != "success" ]; then
            echo "Backend build failed."
            failed=1
          fi

          exit "$failed"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check frontend formatting
        id: frontend_prettier
        continue-on-error: true
        shell: bash
        run: |
          output_file="$RUNNER_TEMP/prettier.txt"
          status=0

          (
            cd frontend
            pnpm exec prettier --list-different .
          ) >"$output_file" 2>&1 || status=$?

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              \[*|Checking\ formatting...|All\ matched\ files\ use*)
                continue
                ;;
            esac
            echo "::error file=frontend/$file::File is not formatted with Prettier"
          done <"$output_file"

          cat "$output_file"
          exit "$status"

      - name: Lint frontend
        id: frontend_eslint
        continue-on-error: true
        run: pnpm --filter frontend exec eslint .

      - name: Type-check frontend
        id: frontend_check
        continue-on-error: true
        shell: bash
        run: |
          output_file="$RUNNER_TEMP/svelte-check.txt"
          status=0

          (
            cd frontend
            pnpm exec svelte-kit sync
            pnpm exec svelte-check --tsconfig ./tsconfig.json --output machine
          ) >"$output_file" 2>&1 || status=$?

          while IFS= read -r line; do
            if [[ "$line" =~ ^[0-9]+\ (ERROR|WARNING)\ \"([^\"]+)\"\ ([0-9]+):([0-9]+)\ \"(.*)\"$ ]]; then
              severity=$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')
              file="${BASH_REMATCH[2]}"
              line_no="${BASH_REMATCH[3]}"
              col_no="${BASH_REMATCH[4]}"
              message="${BASH_REMATCH[5]}"

              if [ "$line_no" -le 0 ]; then
                line_no=1
              fi

              if [ "$col_no" -le 0 ]; then
                col_no=1
              fi

              echo "::$severity file=frontend/$file,line=$line_no,col=$col_no::$message"
            fi
          done <"$output_file"

          cat "$output_file"
          exit "$status"

      - name: Build frontend
        id: frontend_build
        continue-on-error: true
        run: pnpm --filter frontend build

      - name: Fail if frontend checks failed
        if: always()
        env:
          FRONTEND_PRETTIER_OUTCOME: ${{ steps.frontend_prettier.outcome }}
          FRONTEND_ESLINT_OUTCOME: ${{ steps.frontend_eslint.outcome }}
          FRONTEND_CHECK_OUTCOME: ${{ steps.frontend_check.outcome }}
          FRONTEND_BUILD_OUTCOME: ${{ steps.frontend_build.outcome }}
        run: |
          failed=0

          if [ "$FRONTEND_PRETTIER_OUTCOME" != "success" ]; then
            echo "Frontend prettier check failed."
            failed=1
          fi

          if [ "$FRONTEND_ESLINT_OUTCOME" != "success" ]; then
            echo "Frontend eslint failed."
            failed=1
          fi

          if [ "$FRONTEND_CHECK_OUTCOME" != "success" ]; then
            echo "Frontend type-check failed."
            failed=1
          fi

          if [ "$FRONTEND_BUILD_OUTCOME" != "success" ]; then
            echo "Frontend build failed."
            failed=1
          fi

          exit "$failed"

  proto:
    name: Proto Validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    env:
      PROTOC_VERSION: "25.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: proto/go.mod
          cache-dependency-path: |
            proto/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}

      - name: Verify generated protobuf artifacts
        run: pnpm --filter proto generate

  go-router:
    name: Go Router
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.router == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: router/go.mod
          cache-dependency-path: |
            proto/go.sum

      - name: Lint router Go module
        working-directory: router
        shell: bash
        run: go vet ./...

      - name: Build router Go module
        working-directory: router
        shell: bash
        run: go build ./...
