name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.filter.outputs.node }}
      backend: ${{ steps.filter.outputs.backend }}
      common: ${{ steps.filter.outputs.common }}
      frontend: ${{ steps.filter.outputs.frontend }}
      proto: ${{ steps.filter.outputs.proto }}
      router: ${{ steps.filter.outputs.router }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed packages
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            node:
              - 'backend/**'
              - 'common/**'
              - 'frontend/**'
              - 'proto/**'
              - 'biome.json'
              - 'package.json'
              - 'pnpm-lock*.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'proto/**'
              - 'common/**'
              - 'biome.json'
              - 'package.json'
              - 'pnpm-lock*.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            common:
              - 'common/**'
              - 'biome.json'
              - 'package.json'
              - 'pnpm-lock*.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'proto/**'
              - 'common/**'
              - 'biome.json'
              - 'package.json'
              - 'pnpm-lock*.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - 'package.json'
              - 'pnpm-lock*.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            router:
              - 'router/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'

  node-workspaces:
    name: Node Workspaces
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.node == 'true'
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      PROTOC_VERSION: "25.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}

      - name: Prepare pnpm lockfile for pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          branch_lockfile="pnpm-lock.${GITHUB_HEAD_REF//\//!}.yaml"

          if [ ! -f "$branch_lockfile" ]; then
            echo "Expected branch lockfile '$branch_lockfile' was not found."
            exit 0
          fi

          cp "$branch_lockfile" pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Prepare frontend environment
        if: needs.changes.outputs.frontend == 'true'
        run: cp frontend/.env.example frontend/.env

      - name: Setup reviewdog
        if: needs.changes.outputs.common == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
        uses: reviewdog/action-setup@v1

      - name: Comment common Biome issues
        id: common_lint
        if: needs.changes.outputs.common == 'true'
        continue-on-error: true
        shell: bash
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reporter="github-check"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            reporter="github-pr-review"
          fi

          output_file="$(mktemp)"
          biome_status=0

          ./common/node_modules/.bin/biome check --reporter=checkstyle common >"$output_file" || biome_status=$?

          reviewdog -f=checkstyle -name="biome-common" -reporter="$reporter" -filter-mode=file -fail-level=any <"$output_file"
          reviewdog_status=$?

          if [ "$biome_status" -gt 1 ]; then
            cat "$output_file"
            exit "$biome_status"
          fi

          exit "$reviewdog_status"

      - name: Comment backend Biome issues
        id: backend_lint
        if: needs.changes.outputs.backend == 'true'
        continue-on-error: true
        shell: bash
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reporter="github-check"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            reporter="github-pr-review"
          fi

          output_file="$(mktemp)"
          biome_status=0

          ./backend/node_modules/.bin/biome check --reporter=checkstyle backend >"$output_file" || biome_status=$?

          reviewdog -f=checkstyle -name="biome-backend" -reporter="$reporter" -filter-mode=file -fail-level=any <"$output_file"
          reviewdog_status=$?

          if [ "$biome_status" -gt 1 ]; then
            cat "$output_file"
            exit "$biome_status"
          fi

          exit "$reviewdog_status"

      - name: Comment frontend Biome issues
        id: frontend_lint
        if: needs.changes.outputs.frontend == 'true'
        continue-on-error: true
        shell: bash
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reporter="github-check"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            reporter="github-pr-review"
          fi

          output_file="$(mktemp)"
          biome_status=0

          ./frontend/node_modules/.bin/biome check --reporter=checkstyle frontend >"$output_file" || biome_status=$?

          reviewdog -f=checkstyle -name="biome-frontend" -reporter="$reporter" -filter-mode=file -fail-level=any <"$output_file"
          reviewdog_status=$?

          if [ "$biome_status" -gt 1 ]; then
            cat "$output_file"
            exit "$biome_status"
          fi

          exit "$reviewdog_status"

      - name: Build frontend type-check dependencies
        id: frontend_dependencies
        if: needs.changes.outputs.frontend == 'true'
        continue-on-error: true
        run: pnpm exec turbo run common#build

      - name: Type-check frontend
        id: frontend_check
        if: needs.changes.outputs.frontend == 'true'
        continue-on-error: true
        shell: bash
        run: |
          output_file="$RUNNER_TEMP/svelte-check.txt"
          status=0

          (
            cd frontend
            pnpm type-check --output machine
          ) >"$output_file" 2>&1 || status=$?

          while IFS= read -r line; do
            if [[ "$line" =~ ^[0-9]+\ (ERROR|WARNING)\ \"([^\"]+)\"\ ([0-9]+):([0-9]+)\ \"(.*)\"$ ]]; then
              severity=$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')
              file="${BASH_REMATCH[2]}"
              line_no="${BASH_REMATCH[3]}"
              col_no="${BASH_REMATCH[4]}"
              message="${BASH_REMATCH[5]}"

              if [ "$line_no" -le 0 ]; then
                line_no=1
              fi

              if [ "$col_no" -le 0 ]; then
                col_no=1
              fi

              echo "::$severity file=frontend/$file,line=$line_no,col=$col_no::$message"
            fi
          done <"$output_file"

          cat "$output_file"
          exit "$status"

      - name: Select Turbo build tasks
        id: turbo_tasks
        shell: bash
        run: |
          build_tasks=()

          if [ "${{ needs.changes.outputs.common }}" = "true" ]; then
            build_tasks+=(common#build)
          fi

          if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            build_tasks+=(backend#build)
          fi

          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            build_tasks+=(frontend#build)
          fi

          if [ "${{ needs.changes.outputs.proto }}" = "true" ]; then
            build_tasks+=(proto#build)
          fi

          echo "build_tasks=${build_tasks[*]}" >> "$GITHUB_OUTPUT"

      - name: Run Turbo builds
        id: turbo_build
        if: steps.turbo_tasks.outputs.build_tasks != ''
        continue-on-error: true
        run: pnpm exec turbo run ${{ steps.turbo_tasks.outputs.build_tasks }}

      - name: Fail if Node workspace checks failed
        if: always()
        env:
          COMMON_CHANGED: ${{ needs.changes.outputs.common }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          BUILD_TASKS: ${{ steps.turbo_tasks.outputs.build_tasks }}
          COMMON_LINT_OUTCOME: ${{ steps.common_lint.outcome }}
          BACKEND_LINT_OUTCOME: ${{ steps.backend_lint.outcome }}
          FRONTEND_LINT_OUTCOME: ${{ steps.frontend_lint.outcome }}
          FRONTEND_DEPENDENCIES_OUTCOME: ${{ steps.frontend_dependencies.outcome }}
          FRONTEND_CHECK_OUTCOME: ${{ steps.frontend_check.outcome }}
          TURBO_BUILD_OUTCOME: ${{ steps.turbo_build.outcome }}
        run: |
          failed=0

          if [ "$COMMON_CHANGED" = "true" ] && [ "$COMMON_LINT_OUTCOME" != "success" ]; then
            echo "Common Biome check failed."
            failed=1
          fi

          if [ "$BACKEND_CHANGED" = "true" ] && [ "$BACKEND_LINT_OUTCOME" != "success" ]; then
            echo "Backend Biome check failed."
            failed=1
          fi

          if [ "$FRONTEND_CHANGED" = "true" ] && [ "$FRONTEND_LINT_OUTCOME" != "success" ]; then
            echo "Frontend Biome check failed."
            failed=1
          fi

          if [ "$FRONTEND_CHANGED" = "true" ] && [ "$FRONTEND_DEPENDENCIES_OUTCOME" != "success" ]; then
            echo "Frontend type-check dependency build failed."
            failed=1
          fi

          if [ "$FRONTEND_CHANGED" = "true" ] && [ "$FRONTEND_CHECK_OUTCOME" != "success" ]; then
            echo "Frontend type-check failed."
            failed=1
          fi

          if [ -n "$BUILD_TASKS" ] && [ "$TURBO_BUILD_OUTCOME" != "success" ]; then
            echo "Turbo build failed."
            failed=1
          fi

          exit "$failed"

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare pnpm lockfile for pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          branch_lockfile="pnpm-lock.${GITHUB_HEAD_REF//\//!}.yaml"

          if [ ! -f "$branch_lockfile" ]; then
            echo "Expected branch lockfile '$branch_lockfile' was not found."
            exit 0
          fi

          cp "$branch_lockfile" pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-tests-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-tests-
            ${{ runner.os }}-turbo-

      - name: Run backend tests with Turbo
        id: backend_tests
        continue-on-error: true
        shell: bash
        run: |
          output_file="$RUNNER_TEMP/backend-test-output.txt"
          set +e

          pnpm exec turbo run backend#test --affected --output-logs=full 2>&1 | tee "$output_file"
          status=${PIPESTATUS[0]}

          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "suites<<EOF"
            awk '
              /(^|backend:test:[[:space:]]+)(PASS|FAIL)[[:space:]]+test\// {
                state = ""
                file = ""
                for (i = 1; i <= NF; i++) {
                  if ($i == "PASS" || $i == "FAIL") {
                    state = $i
                    file = $(i + 1)
                    break
                  }
                }
                if (state != "" && file != "") {
                  icon = state == "PASS" ? "✅" : "❌"
                  print icon " `" file "`"
                }
              }
            ' "$output_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment backend test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          TEST_STATUS: ${{ steps.backend_tests.outputs.status }}
          TEST_SUITES: ${{ steps.backend_tests.outputs.suites }}
        with:
          script: |
            const marker = "<!-- backend-test-results -->";
            const passed = process.env.TEST_STATUS === "0";
            const icon = passed ? "✅" : "❌";
            const status = passed ? "PASSED" : "FAILED";
            const suites = process.env.TEST_SUITES?.trim();

            const body = [
              marker,
              `### ${icon} Backend tests ${status}.`,
              suites ? `\n${suites}` : "",
              "",
              `[View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user.type === "Bot" && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail if backend tests failed
        if: steps.backend_tests.outputs.status != '0'
        run: exit 1

  proto:
    name: Proto Validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    env:
      PROTOC_VERSION: "25.2"
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: proto/go.mod
          cache-dependency-path: |
            proto/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare pnpm lockfile for pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          branch_lockfile="pnpm-lock.${GITHUB_HEAD_REF//\//!}.yaml"

          if [ ! -f "$branch_lockfile" ]; then
            echo "Expected branch lockfile '$branch_lockfile' was not found."
            exit 0
          fi

          cp "$branch_lockfile" pnpm-lock.yaml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}

      - name: Verify generated protobuf artifacts
        run: pnpm exec turbo run proto#generate --force

      - name: Lint generated Go proto module
        working-directory: proto
        run: go vet ./...

      - name: Build generated Go proto module
        working-directory: proto
        run: go build ./...

  go-router:
    name: Go Router
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.router == 'true'
    env:
      PROTOC_VERSION: "25.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: router/go.mod
          cache-dependency-path: |
            router/go.sum
            proto/go.sum

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}

      - name: Generate Go protobuf artifacts
        run: node proto/scripts/generate.mjs go

      - name: Lint router Go module
        working-directory: router
        shell: bash
        run: go vet ./...

      - name: Build router Go module
        working-directory: router
        shell: bash
        run: go build ./...
