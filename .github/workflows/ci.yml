name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      proto: ${{ steps.filter.outputs.proto }}
      router: ${{ steps.filter.outputs.router }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed packages
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'proto/**'
              - 'biome.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'proto/**'
              - 'biome.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            router:
              - 'router/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1

      - name: Comment backend Biome issues
        id: backend_lint
        continue-on-error: true
        shell: bash
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reporter="github-check"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            reporter="github-pr-review"
          fi

          output_file="$(mktemp)"
          biome_status=0

          pnpm --filter backend exec biome check --reporter=checkstyle . >"$output_file" || biome_status=$?

          reviewdog -f=checkstyle -name="biome-backend" -reporter="$reporter" -filter-mode=diff_context -fail-level=any <"$output_file"
          reviewdog_status=$?

          if [ "$biome_status" -gt 1 ]; then
            cat "$output_file"
            exit "$biome_status"
          fi

          exit "$reviewdog_status"

      - name: Build backend
        id: backend_build
        continue-on-error: true
        run: pnpm --filter backend build

      - name: Fail if backend checks failed
        if: always()
        env:
          BACKEND_LINT_OUTCOME: ${{ steps.backend_lint.outcome }}
          BACKEND_BUILD_OUTCOME: ${{ steps.backend_build.outcome }}
        run: |
          failed=0

          if [ "$BACKEND_LINT_OUTCOME" != "success" ]; then
            echo "Backend Biome check failed."
            failed=1
          fi

          if [ "$BACKEND_BUILD_OUTCOME" != "success" ]; then
            echo "Backend build failed."
            failed=1
          fi

          exit "$failed"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1

      - name: Comment frontend Biome issues
        id: frontend_lint
        continue-on-error: true
        shell: bash
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reporter="github-check"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            reporter="github-pr-review"
          fi

          output_file="$(mktemp)"
          biome_status=0

          pnpm --filter frontend exec biome check --reporter=checkstyle . >"$output_file" || biome_status=$?

          reviewdog -f=checkstyle -name="biome-frontend" -reporter="$reporter" -filter-mode=diff_context -fail-level=any <"$output_file"
          reviewdog_status=$?

          if [ "$biome_status" -gt 1 ]; then
            cat "$output_file"
            exit "$biome_status"
          fi

          exit "$reviewdog_status"

      - name: Type-check frontend
        id: frontend_check
        continue-on-error: true
        shell: bash
        run: |
          output_file="$RUNNER_TEMP/svelte-check.txt"
          status=0

          (
            cd frontend
            pnpm exec svelte-kit sync
            pnpm exec svelte-check --tsconfig ./tsconfig.json --output machine
          ) >"$output_file" 2>&1 || status=$?

          while IFS= read -r line; do
            if [[ "$line" =~ ^[0-9]+\ (ERROR|WARNING)\ \"([^\"]+)\"\ ([0-9]+):([0-9]+)\ \"(.*)\"$ ]]; then
              severity=$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')
              file="${BASH_REMATCH[2]}"
              line_no="${BASH_REMATCH[3]}"
              col_no="${BASH_REMATCH[4]}"
              message="${BASH_REMATCH[5]}"

              if [ "$line_no" -le 0 ]; then
                line_no=1
              fi

              if [ "$col_no" -le 0 ]; then
                col_no=1
              fi

              echo "::$severity file=frontend/$file,line=$line_no,col=$col_no::$message"
            fi
          done <"$output_file"

          cat "$output_file"
          exit "$status"

      - name: Build frontend
        id: frontend_build
        continue-on-error: true
        run: pnpm --filter frontend build

      - name: Fail if frontend checks failed
        if: always()
        env:
          FRONTEND_LINT_OUTCOME: ${{ steps.frontend_lint.outcome }}
          FRONTEND_CHECK_OUTCOME: ${{ steps.frontend_check.outcome }}
          FRONTEND_BUILD_OUTCOME: ${{ steps.frontend_build.outcome }}
        run: |
          failed=0

          if [ "$FRONTEND_LINT_OUTCOME" != "success" ]; then
            echo "Frontend Biome check failed."
            failed=1
          fi

          if [ "$FRONTEND_CHECK_OUTCOME" != "success" ]; then
            echo "Frontend type-check failed."
            failed=1
          fi

          if [ "$FRONTEND_BUILD_OUTCOME" != "success" ]; then
            echo "Frontend build failed."
            failed=1
          fi

          exit "$failed"

  proto:
    name: Proto Validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    env:
      PROTOC_VERSION: "25.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: proto/go.mod
          cache-dependency-path: |
            proto/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}

      - name: Verify generated protobuf artifacts
        run: pnpm --filter proto generate

      - name: Lint generated Go proto module
        working-directory: proto
        run: go vet ./...

      - name: Build generated Go proto module
        working-directory: proto
        run: go build ./...

  go-router:
    name: Go Router
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.router == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: router/go.mod
          cache-dependency-path: |
            proto/go.sum

      - name: Lint router Go module
        working-directory: router
        shell: bash
        run: go vet ./...

      - name: Build router Go module
        working-directory: router
        shell: bash
        run: go build ./...
