name: CI Summary

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_run:
    workflows:
      - CI Backend
      - CI Common
      - CI Frontend
      - CI Proto
      - CI Router
    types:
      - requested
      - in_progress
      - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  update-pr-comment:
    name: Update PR CI Summary
    if: github.event_name == 'pull_request_target' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Comment CI summary
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- ci-workflow-summary -->";
            const workflowRun = context.payload.workflow_run;
            const pullRequest =
              context.payload.pull_request ?? workflowRun?.pull_requests?.[0];

            if (!pullRequest) {
              core.info("Run is not associated with a pull request; skipping summary.");
              return;
            }

            const headSha = workflowRun?.head_sha ?? pullRequest.head.sha;
            const triggerRunUrl = workflowRun?.html_url ??
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const workflows = [
              { name: "CI Common", file: "ci-common.yml" },
              { name: "CI Frontend", file: "ci-frontend.yml" },
              { name: "CI Backend", file: "ci-backend.yml" },
              { name: "CI Proto", file: "ci-proto.yml" },
              { name: "CI Router", file: "ci-router.yml" },
            ];

            const { owner, repo } = context.repo;
            const pullRequestNumber = pullRequest.number;

            const latestRunsByName = new Map();
            for (const workflow of workflows) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: workflow.file,
                event: "pull_request",
                per_page: 100,
              });

              for (const run of runs) {
                const belongsToPullRequest = run.pull_requests?.some(
                  (runPullRequest) => runPullRequest.number === pullRequestNumber
                );

                if (!belongsToPullRequest) {
                  continue;
                }

                const existing = latestRunsByName.get(workflow.name);
                const existingTime = existing ? Date.parse(existing.updated_at) : 0;
                const runTime = Date.parse(run.updated_at);

                if (!existing || runTime > existingTime) {
                  latestRunsByName.set(workflow.name, run);
                }
              }
            }

            const describeRun = (workflow) => {
              const run = latestRunsByName.get(workflow.name);
              const fallbackUrl = `${context.serverUrl}/${owner}/${repo}/actions/workflows/${workflow.file}`;

              if (!run) {
                return `| ${workflow.name} | Not triggered | [Workflow](${fallbackUrl}) |`;
              }

              if (run.status !== "completed") {
                const label = run.status === "in_progress" ? "Running" : "Queued";
                return `| ${workflow.name} | ${label} | [Run](${run.html_url}) |`;
              }

              const conclusions = {
                success: "Passed",
                failure: "Failed",
                cancelled: "Cancelled",
                skipped: "Skipped",
                timed_out: "Timed out",
                action_required: "Action required",
                neutral: "Neutral",
              };
              const label = conclusions[run.conclusion] ?? run.conclusion ?? "Completed";

              return `| ${workflow.name} | ${label} | [Run](${run.html_url}) |`;
            };

            const body = [
              marker,
              "### CI workflow summary",
              "",
              `Pull request: #${pullRequestNumber}`,
              `Commit: \`${headSha.slice(0, 7)}\``,
              "",
              "| Workflow | Status | Link |",
              "| --- | --- | --- |",
              ...workflows.map(describeRun),
              "",
              `[View trigger run](${triggerRunUrl})`,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user.type === "Bot" && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullRequest.number,
                body,
              });
            }
