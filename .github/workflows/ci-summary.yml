name: CI Summary

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  publish:
    name: Publish PR Summary
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Publish PR summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- virtual-networks-ci-summary -->";
            const run = context.payload.workflow_run;
            const pr = run.pull_requests?.[0];

            if (!pr) {
              core.notice("This CI run is not associated with a pull request.");
              return;
            }

            const statusLabel = (conclusion) => {
              switch (conclusion) {
                case "success":
                  return "✅ passed";
                case "failure":
                  return "❌ failed";
                case "cancelled":
                  return "🛑 cancelled";
                case "skipped":
                  return "⏭️ skipped";
                case "timed_out":
                  return "⏱️ timed out";
                case "neutral":
                  return "➖ neutral";
                case "action_required":
                  return "⚠️ action required";
                default:
                  return conclusion ? `❔ ${conclusion}` : "❔ unknown";
              }
            };

            const reportedSteps = new Set([
              "Comment common Biome issues",
              "Comment backend Biome issues",
              "Comment frontend Biome issues",
              "Build frontend type-check dependencies",
              "Type-check frontend",
              "Build common",
              "Build backend",
              "Build frontend",
              "Build proto TypeScript artifacts",
              "Fail if Node workspace checks failed",
              "Verify generated protobuf artifacts",
              "Lint generated Go proto module",
              "Build generated Go proto module",
              "Lint router Go module",
              "Build router Go module",
            ]);

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });

            const jobRows = jobs.map((job) => [
              job.name,
              statusLabel(job.conclusion),
            ]);

            const stepRows = jobs.flatMap((job) =>
              (job.steps || [])
                .filter((step) => reportedSteps.has(step.name))
                .map((step) => [
                  job.name,
                  step.name,
                  statusLabel(step.conclusion),
                ]),
            );

            const failedJobs = jobRows.filter(([, result]) =>
              result.includes("failed") ||
              result.includes("cancelled") ||
              result.includes("timed out") ||
              result.includes("action required"),
            );

            const failedSteps = stepRows.filter(([, , result]) =>
              result.includes("failed") ||
              result.includes("cancelled") ||
              result.includes("timed out") ||
              result.includes("action required"),
            );

            const overall = run.conclusion === "success" ? "✅ passed" : statusLabel(run.conclusion);
            const shortSha = run.head_sha.slice(0, 7);
            const jobTable = jobRows
              .map(([job, result]) => `| ${job} | ${result} |`)
              .join("\n");
            const stepTable = stepRows.length === 0
              ? "_No reported validation steps ran._"
              : stepRows
                .map(([job, step, result]) => `| ${job} | ${step} | ${result} |`)
                .join("\n");
            const failures = [...failedJobs.map(([job, result]) => `- ${job}: ${result}`), ...failedSteps.map(([job, step, result]) => `- ${job} / ${step}: ${result}`)];
            const failureText = failures.length === 0 ? "✅ None" : failures.join("\n");

            const body = [
              marker,
              "## 🧪 CI summary",
              "",
              `Overall: **${overall}**`,
              "",
              `Run: [${run.display_title || `#${run.run_number}`}](${run.html_url})`,
              `Commit: \`${shortSha}\``,
              "",
              "| Job | Result |",
              "| --- | --- |",
              jobTable,
              "",
              "| Job | Check | Result |",
              "| --- | --- | --- |",
              stepTable,
              "",
              "### 🚨 Failed or cancelled",
              failureText,
            ].join("\n");

            await core.summary.addRaw(body).write();

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const previous = comments.find((comment) => comment.body?.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
