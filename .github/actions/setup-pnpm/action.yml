name: Setup pnpm workspace
description: Setup pnpm, Node.js, optional branch lockfile, and optional dependency install.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "22"
  install:
    description: Install workspace dependencies.
    required: false
    default: "true"
  install-args:
    description: Arguments passed to pnpm install.
    required: false
    default: "--frozen-lockfile --ignore-scripts"
  prepare-branch-lockfile:
    description: Copy a pull request branch lockfile into pnpm-lock.yaml when present.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Prepare pnpm lockfile for pull requests
      if: inputs.prepare-branch-lockfile == 'true' && github.event_name == 'pull_request'
      shell: bash
      run: |
        branch_lockfile="pnpm-lock.${GITHUB_HEAD_REF//\//!}.yaml"

        if [ ! -f "$branch_lockfile" ]; then
          echo "Expected branch lockfile '$branch_lockfile' was not found."
          exit 0
        fi

        cp "$branch_lockfile" pnpm-lock.yaml

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install ${{ inputs.install-args }}
